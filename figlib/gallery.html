<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Figure Library</title>
<meta name="description" content="Figures from award-winning and high-impact computer science papers, cut out and sorted by figure type, venue and year. A reference library for drawing your own.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta property="og:title" content="Paper Figure Library">
<meta property="og:description" content="Figures from award-winning and high-impact CS papers, sorted by type, venue and year.">
<meta property="og:image" content="icon-512.png">
<meta name="theme-color" content="#1F5F8B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #F4F5F3;
  --surface: #FFFFFF;
  --surface-2: #ECEEEA;
  --line: #D9DCD6;
  --ink: #1B1F24;
  --muted: #667079;
  --accent: #1F5F8B;
  --accent-ink: #FFFFFF;
  --thumb-bg: #FFFFFF;
  --c-background: #B9761A;
  --c-method: #2E6DB4;
  --c-data: #2F8F5B;
  --c-example: #8452B5;
  --c-prompt: #7A7F85;
  --c-table: #8C5A3C;
  --c-other: #9AA0A6;
  --shadow: 0 1px 2px rgba(20,30,40,.06), 0 8px 24px rgba(20,30,40,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181C; --surface: #1E2228; --surface-2: #262B32; --line: #333A42;
    --ink: #E6E8EB; --muted: #8B949E; --accent: #6FA8DC; --accent-ink: #0F1A24;
    --thumb-bg: #F7F7F5;
    --c-background: #D89A45; --c-method: #6FA8DC; --c-data: #5DBB84; --c-example: #B48AE0;
    --c-prompt: #9AA0A6; --c-table: #C08A68; --c-other: #7D848A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181C; --surface: #1E2228; --surface-2: #262B32; --line: #333A42;
  --ink: #E6E8EB; --muted: #8B949E; --accent: #6FA8DC; --accent-ink: #0F1A24;
  --thumb-bg: #F7F7F5;
  --c-background: #D89A45; --c-method: #6FA8DC; --c-data: #5DBB84; --c-example: #B48AE0;
  --c-prompt: #9AA0A6; --c-table: #C08A68; --c-other: #7D848A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
  font-size: 14px; line-height: 1.5;
  padding-inline: 16px; padding-block: 0;
}
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding-block: 12px 10px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; flex: none; }
.gh { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.gh svg { width: 15px; height: 15px; fill: currentColor; }
.credit { margin-top: 6px; }
.credit a { color: inherit; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.bar .stats { color: var(--muted); font-size: 12px; margin-left: auto; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; flex: 1 1 600px; }   /* search + filters share the title line */
.search { flex: 1 1 260px; min-width: 200px; max-width: 520px; display: flex; }
.search input {
  width: 100%; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font: inherit;
}
.search input::placeholder { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.controls select {
  padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); font: inherit;
}

/* ---------- layout */
.wrap { display: grid; grid-template-columns: 200px 1fr; gap: 20px; padding-block: 14px 40px; }
.rail { position: sticky; top: 74px; align-self: start; height: calc(100vh - 124px); display: flex; flex-direction: column; }
.rail-body { flex: 1; min-height: 0; overflow: auto; }
.rail-foot { flex: none; padding: 12px 0 6px; border-top: 1px solid var(--line); }
.rail-foot .gh { color: var(--muted); font-size: 12px; gap: 8px; }
.rail-foot .gh b { font-weight: 600; color: var(--ink); }
.rail-foot .gh small { display: block; font-size: 10.5px; opacity: .85; }
.rail-foot .gh:hover { color: var(--ink); }
.rail-foot .gh svg { width: 18px; height: 18px; }
.rail-toggle { display: none; }
/* phones: filters collapse into a button above the figures; the rail is no longer sticky or full-height */
@media (max-width: 760px) {
  .wrap { grid-template-columns: 1fr; gap: 8px; }
  .rail { position: static; height: auto; display: block; }
  .rail-toggle { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 4px; }
  .rail-body { display: none; max-height: 60vh; overflow: auto; padding-bottom: 6px; }
  .rail.open .rail-body { display: block; }
  .rail-foot { border-top: 0; padding: 0; margin-left: 12px; display: inline-block; vertical-align: middle; }
  .rail-foot .gh small { display: none; }
}
.rail h2 { margin: 12px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tree { list-style: none; margin: 0; padding: 0; }
.tree li { margin: 0; }
.tree button {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer;
}
.tree button:hover { background: var(--surface-2); }
.tree button[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.tree .sub button { padding-left: 24px; }
.tree .n { margin-left: auto; color: var(--muted); font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c-other); }
.dot.background { background: var(--c-background); } .dot.method { background: var(--c-method); }
.dot.data { background: var(--c-data); } .dot.example { background: var(--c-example); }
.dot.prompt { background: var(--c-prompt); } .dot.table { background: var(--c-table); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent;
  font-size: 12px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- grid */
.main { min-width: 0; }
.result-line { color: var(--muted); font-size: 12px; margin: 0 0 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.result-line b { color: var(--ink); font-weight: 500; }
/* justified wall: each card asks for a width proportional to the figure's physical size in the paper;
   flex then stretches the row to fill, so a full-width figure takes about two slots and a small panel less than one */
/* justified rows: JS gives every card an explicit width and height so each row spans the page exactly, no holes */
.grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
h3.group { margin: 22px 0 4px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
h3.group:first-child { margin-top: 4px; }
.tier { margin: 8px 0 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card {
  margin: 0; background: var(--thumb-bg); border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden; cursor: pointer; display: block; width: 100%; padding: 0; text-align: left; position: relative;
}
.card:hover, .card:focus-visible { box-shadow: var(--shadow); border-color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack .card { width: 100% !important; }
.card .img { display: block; width: 100%; height: 100%; padding: 5px; box-sizing: border-box; }
.card img { display: block; width: 100%; height: 100%; object-fit: contain; }
/* hover ribbon: a translucent strip along the bottom edge, sized by its four short lines */
.card .hover {
  position: absolute; left: 0; right: 0; bottom: 0; display: block;
  padding: 6px 9px 7px; color: #fff; font-size: 11px; line-height: 1.3;
  background: rgba(14,17,21,.78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0; transform: translateY(6px); transition: opacity .18s ease, transform .18s ease; pointer-events: none;
}
.card:hover .hover, .card:focus-visible .hover { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .card .hover { transition: none; transform: none; } }
.card .hover > span { display: block; min-width: 0; }
.card .hover .line1 { display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .02em; }
.card .hover .venue { font-weight: 600; white-space: nowrap; }
.card .hover .award { opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .hover .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .hover .authors { opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
.card .hover .kind { display: flex; align-items: center; gap: 5px; opacity: .85; font-size: 10px; margin-top: 1px; }
.card .hover .kind .dot { width: 7px; height: 7px; flex: none; }
@media (hover: none) and (pointer: coarse) { .card .hover { opacity: 1; transform: none; } }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.tag .dot { width: 7px; height: 7px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.more { display: block; margin: 8px auto 0; padding: 8px 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }

/* ---------- lightbox */
.lb { position: fixed; inset: 0; background: rgba(10,14,18,.78); z-index: 20; display: grid; place-items: center; padding: 16px; }
.lb[hidden] { display: none; }
.lb .box {
  background: var(--surface); color: var(--ink); border-radius: 10px; max-width: min(1400px, 100%); max-height: 100%;
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 320px; overflow: hidden; box-shadow: var(--shadow);
}
@media (max-width: 860px) { .lb .box { grid-template-columns: 1fr; overflow: auto; } }
.lb .view { background: var(--thumb-bg); display: grid; place-items: center; padding: 16px; min-height: 240px; overflow: auto; max-height: calc(100vh - 32px); }
.lb .view img { max-width: 100%; max-height: calc(100vh - 64px); height: auto; display: block; cursor: zoom-in; }
.lb .view.natural { place-items: start; }
.lb .view.natural img { max-width: none; max-height: none; cursor: zoom-out; }
.lb .side { padding: 18px 18px 20px; overflow: auto; max-height: calc(100vh - 32px); display: flex; flex-direction: column; gap: 12px; border-left: 1px solid var(--line); }
.lb .side h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.lb .kv { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; font-size: 12px; }
.lb .kv dt { color: var(--muted); } .lb .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.lb .caption { font-size: 13px; color: var(--ink); margin: 0; }
.lb .summary { font-size: 13px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--surface-2); margin: 0; }
.lb .tags { display: flex; flex-wrap: wrap; gap: 5px; }
.lb .tags span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.lb .nav { display: flex; gap: 8px; margin-top: auto; }
.lb .nav button, .lb .close { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; }
.lb .close { position: absolute; top: 24px; right: 24px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s ease, border-color .15s ease; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="logo" src="favicon.svg" alt="" width="26" height="26">
    <h1>Paper Figure Library</h1>
  </div>
  <div class="bar">
  <div class="search"><input id="q" type="search" placeholder="搜图注、论文题目、标签、arXiv 号"></div>
  <div class="controls">
    <label for="venue" id="l-venue">会议</label>
    <select id="venue"><option value="" id="o-allvenue">全部</option></select>
    <label for="sort" id="l-sort">排序</label>
    <select id="sort">
      <option value="paper" id="o-paper">按论文</option>
      <option value="wall" id="o-wall">新到旧</option>
      <option value="edition" id="o-edition">按届分组</option>
      <option value="year" id="o-year">年份新到旧</option>
      <option value="wide" id="o-wide">宽图优先</option>
      <option value="tall" id="o-tall">高图优先</option>
    </select>
    <button class="chip" id="lang" type="button" aria-label="switch language">EN</button>
  </div>
  <span class="stats" id="stats"></span>
  </div>
</header>

<div class="wrap">
  <aside class="rail">
   <button class="chip rail-toggle" id="railToggle" type="button" aria-expanded="false">筛选 ▾</button>
   <div class="rail-body">
    <h2 id="h-type">图的类型</h2>
    <ul class="tree" id="tree"></ul>
    <h2 id="h-source">来源</h2>
    <div class="chips" id="sources"></div>
    <h2 id="h-draw">绘制方式</h2>
    <div class="chips" id="draw"></div>
    <h2 id="h-style">同款数据图</h2>
    <div class="chips" id="style"></div>
    <h2 id="h-textbox">文字框</h2>
    <div class="chips" id="textbox"></div>
   </div>
   <div class="rail-foot">
    <a class="gh" href="https://github.com/fengxijia/PaperFigureLib" target="_blank" rel="noopener" title="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span><b>xixisphere</b><small>GitHub</small></span></a>
   </div>
  </aside>
  <main class="main">
    <p class="result-line" id="resultLine"></p>
    <div id="grid"></div>
    <button class="more" id="more" hidden>显示更多</button>
    <p class="empty" id="empty" hidden>没有符合条件的图。换个关键词或者放宽筛选。</p>
    <p class="result-line" id="footer" style="margin-top:32px">图片版权归各论文作者所有，本站仅供学术参考；每张图都标明了论文出处。</p>
    <p class="result-line credit" id="credit"></p>
  </main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="figure detail">
  <button class="close" id="lbClose" aria-label="close">关闭 Esc</button>
  <div class="box">
    <div class="view"><img id="lbImg" alt=""></div>
    <div class="side">
      <h3 id="lbTitle"></h3>
      <p class="caption" id="lbAuthors" style="color:var(--muted);margin-top:-6px"></p>
      <dl class="kv">
        <dt id="k-num">图号</dt><dd class="mono" id="lbNum"></dd>
        <dt id="k-kind">类型</dt><dd id="lbKind"></dd>
        <dt id="k-venue">会议</dt><dd id="lbVenue"></dd>
        <dt>arXiv</dt><dd class="mono" id="lbArxiv"></dd>
        <dt id="k-pos">位置</dt><dd class="mono" id="lbPos"></dd>
        <dt id="k-file">原图</dt><dd id="lbFile"></dd>
      </dl>
      <p class="summary" id="lbSummary"></p>
      <p class="caption" id="lbCap"></p>
      <div class="tags" id="lbTags"></div>
      <div class="nav">
        <button id="lbPrev">上一张</button>
        <button id="lbNext">下一张</button>
        <button id="lbShare">复制链接</button>
      </div>
    </div>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>

async function loadData() {
  if (!SITE.shards) return JSON.parse(document.getElementById('data').textContent);
  const parts = await Promise.all(SITE.shards.map(u => fetch(u).then(r => r.json())));
  const head = parts[0];
  return { ...head, papers: parts.flatMap(p => p.papers) };
}

  $('lbNum').textContent = t('figure', { n: f.num }) + (f.panel ? t('panel', { k: f.panel, n: f.nPanels }) : '');
  $('lbKind').textContent = (CAT_ZH[f.cat] || f.cat) + (f.chart ? ' · ' + (CHART_ZH[f.chart] || f.chart) : '') + (f.labeled ? (f.verified ? ' · ' + t('verified', { m: f.verified }) : '') : t('heur'));
  $('lbVenue').textContent = ([f.venue, f.year].filter(Boolean).join(' ') || t('unknown')) + (f.area ? ' · ' + areaLabel(f.area) : '') + (f.note && f.source === 'award' ? ' · ' + f.note.split(':')[0] : '') + (f.source === 'seed' ? ' · ' + TIER[LANG][4] : '');
  $('lbArxiv').innerHTML = f.arxiv ? `<a href="https://arxiv.org/abs/${esc(f.arxiv)}" target="_blank" rel="noopener">${esc(f.arxiv)}</a>` : (f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${t('pdf')}</a>` : t('none'));
  $('lbPos').textContent = `${t('page', { p: f.page })} · ${f.w}×${f.h}px · ${f.raster ? t('bitmap') : t('vec')}${f.wide ? ' · ' + t('full') : ''} · ${t('zoom')}`;
  $('lbFile').innerHTML = `<a href="${esc(f.full)}" target="_blank" rel="noopener">${t('openPng')}</a>`;
  history.replaceState(null, '', '#fig=' + encodeURIComponent(f.id));
  $('lbSummary').textContent = f.summary || '';
  $('lbSummary').hidden = !f.summary;
  $('lbCap').textContent = f.caption;
  $('lbTags').innerHTML = f.tags.map(t => `<span>${esc(t)}</span>`).join('');
  $('lbImg').parentElement.classList.remove('natural');
  $('lb').hidden = false;
  $('lbPrev').disabled = i <= 0; $('lbNext').disabled = i >= current.length - 1;
  $('lbClose').focus();
}
function closeLb() { $('lb').hidden = true; lbIndex = -1; history.replaceState(null, '', location.pathname + location.search); }
function applyLang() {
  CAT_ZH = CAT_L[LANG]; CHART_ZH = CHART_L[LANG];
  $('q').placeholder = t('search'); $('l-venue').textContent = t('venue'); $('o-allvenue').textContent = t('all'); $('l-sort').textContent = t('sort');
  $('o-wall').textContent = t('byWall'); $('o-edition').textContent = t('byEdition'); $('o-paper').textContent = t('byPaper'); $('o-year').textContent = t('byYear'); $('o-wide').textContent = t('wide'); $('o-tall').textContent = t('tall');
  $('h-type').textContent = t('type'); $('h-source').textContent = t('source'); $('h-draw').textContent = t('draw'); $('h-textbox').textContent = t('textbox'); $('h-style').textContent = t('styleH'); $('railToggle').textContent = t('filters') + ' ▾';
  $('more').textContent = t('more'); $('empty').textContent = t('empty'); $('footer').textContent = t('footer'); $('credit').innerHTML = t('credit'); $('lbClose').textContent = t('close');
  $('k-num').textContent = t('num'); $('k-kind').textContent = t('kind'); $('k-venue').textContent = t('venue'); $('k-pos').textContent = t('pos'); $('k-file').textContent = t('file');
  $('lbPrev').textContent = t('prev'); $('lbNext').textContent = t('next'); $('lbShare').textContent = t('share');
  $('lang').textContent = LANG === 'zh' ? 'EN' : '中文';
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  $('stats').textContent = t('stats', { p: DATA.n_papers, f: DATA.n_figures, d: DATA.generated });
  buildRail(); render();
}

$('grid').addEventListener('click', e => { const b = e.target.closest('.card'); if (b) openLb(+b.dataset.i); });
$('lbClose').addEventListener('click', closeLb);
$('lbImg').addEventListener('click', () => $('lbImg').parentElement.classList.toggle('natural'));
$('lb').addEventListener('click', e => { if (e.target === $('lb')) closeLb(); });
$('lbPrev').addEventListener('click', () => openLb(lbIndex - 1));
$('lbShare').addEventListener('click', async () => { try { await navigator.clipboard.writeText(location.href); $('lbShare').textContent = t('copied'); setTimeout(() => $('lbShare').textContent = t('share'), 1500); } catch (e) {} });
$('lang').addEventListener('click', () => { LANG = LANG === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('figlib-lang', LANG); } catch (e) {} applyLang(); });
$('lbNext').addEventListener('click', () => openLb(lbIndex + 1));
document.addEventListener('keydown', e => {
  if ($('lb').hidden) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft' && lbIndex > 0) openLb(lbIndex - 1);
  if (e.key === 'ArrowRight' && lbIndex < current.length - 1) openLb(lbIndex + 1);
});
$('q').addEventListener('input', e => { state.q = e.target.value.trim(); state.shown = 200; render(); });
$('venue').addEventListener('change', e => { const v = e.target.value; state.area = v.startsWith('area:') ? v.slice(5) : ''; state.venue = v.startsWith('area:') ? '' : v; state.shown = 200; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('more').addEventListener('click', () => { state.shown += 200; render(); });
$('railToggle').addEventListener('click', () => { const r = document.querySelector('.rail'); const open = r.classList.toggle('open'); $('railToggle').setAttribute('aria-expanded', open ? 'true' : 'false'); $('railToggle').textContent = t('filters') + (open ? ' ▴' : ' ▾'); });

applyLang();
if (location.search.includes('hoverdemo')) { const st = document.createElement('style'); st.textContent = '.card:nth-child(-n+3) .hover{opacity:1;transform:none}'; document.head.appendChild(st); }
// deep link: #fig=<id> opens that figure
{ const m = location.hash.match(/^#fig=(.+)$/); if (m) { const id = decodeURIComponent(m[1]); state.textbox = 'show'; state.style = 'all'; render(); const i = current.findIndex(f => f.id === id); if (i >= 0) openLb(i); } }
})();
</script>
</body>
</html>
