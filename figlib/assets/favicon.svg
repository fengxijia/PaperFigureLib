<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213F"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B04A"/>
      <stop offset="1" stop-color="#F7DD9B"/>
    </linearGradient>
  </defs>
  <!-- midnight tile with a hairline highlight -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1.5"/>
  <!-- a figure frame -->
  <rect x="12" y="14" width="40" height="36" rx="7.5" fill="none" stroke="#F4EFE4" stroke-width="3.2"/>
  <!-- faint bars behind -->
  <rect x="19" y="37" width="5" height="7" rx="1.4" fill="#F4EFE4" fill-opacity=".32"/>
  <rect x="27" y="33" width="5" height="11" rx="1.4" fill="#F4EFE4" fill-opacity=".32"/>
  <rect x="35" y="29" width="5" height="15" rx="1.4" fill="#F4EFE4" fill-opacity=".32"/>
  <!-- the gold curve and its end point -->
  <path d="M18.5 38.5 C 24 37.5, 26.5 27.5, 32 29 S 40 22.5, 45 22" fill="none" stroke="url(#gold)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="22" r="4" fill="#F7DD9B"/>
</svg>
